<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Routine Rebels{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #D97706;
            --color-on-primary: #0F172A;
            --color-secondary: #F59E0B;
            --color-accent: #047857;
            --color-on-accent: #FFFFFF;
            --color-background: #FFFBEB;
            --color-foreground: #0F172A;
            --color-card: #FFFFFF;
            --color-card-foreground: #0F172A;
            --color-muted: #FCF6F0;
            --color-muted-foreground: #57534E;
            --color-border: #F3E4C8;
            --color-destructive: #DC2626;
            --color-ring: #D97706;
        }
        body { font-family: 'Raleway', sans-serif; background-color: var(--color-background); color: var(--color-foreground); }
        h1, h2, h3, .font-display { font-family: 'Lora', serif; }
        a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
            outline: 2px solid var(--color-ring);
            outline-offset: 2px;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col">
    <nav class="bg-[var(--color-card)]/80 backdrop-blur-md shadow-sm border-b border-[var(--color-border)] sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <a href="/" class="flex flex-col">
                        <span class="text-xl font-display font-bold bg-gradient-to-r from-[var(--color-primary)] to-[var(--color-secondary)] bg-clip-text text-transparent">Routine Rebels</span>
                        <span class="text-xs text-[var(--color-muted-foreground)]">Build better habits, one day at a time</span>
                    </a>
                </div>
                <div class="hidden md:flex space-x-1">
                    <a href="/habit-tracker" class="px-4 py-2 rounded-lg text-[var(--color-muted-foreground)] hover:text-[var(--color-foreground)] hover:bg-[var(--color-muted)] transition-colors duration-200 cursor-pointer">
                        <span class="flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Habits
                        </span>
                    </a>
                </div>
                <button class="md:hidden p-2 rounded-lg hover:bg-[var(--color-muted)] cursor-pointer" onclick="toggleMobileMenu()" aria-label="Toggle navigation menu" aria-controls="mobileMenu" aria-expanded="false">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
            </div>
        </div>
        <div id="mobileMenu" class="hidden md:hidden bg-[var(--color-card)] border-t border-[var(--color-border)]">
            <div class="px-2 pt-2 pb-3 space-y-1">
                <a href="/habit-tracker" class="block px-3 py-2 rounded-md text-[var(--color-muted-foreground)] hover:text-[var(--color-foreground)] hover:bg-[var(--color-muted)]">Habit Tracker</a>
            </div>
        </div>
    </nav>

    <main class="flex-1">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="animate-fade-in">
                {% block content %}{% endblock %}
            </div>
        </div>
    </main>

    <footer class="bg-[var(--color-card)] border-t border-[var(--color-border)] mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <p class="text-[var(--color-muted-foreground)] text-sm">© 2025 Routine Rebels</p>
                <div class="flex space-x-6 mt-4 md:mt-0">
                    <a href="https://github.com" class="text-[var(--color-muted-foreground)] hover:text-[var(--color-foreground)]" aria-label="GitHub">
                        <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <script>
        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            const button = document.querySelector('[aria-controls="mobileMenu"]');
            const isHidden = menu.classList.toggle('hidden');
            if (button) {
                button.setAttribute('aria-expanded', String(!isHidden));
            }
        }
    </script>
</body>
</html>
