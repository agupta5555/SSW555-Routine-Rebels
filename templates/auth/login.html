{% extends "base.html" %}

{% block title %}Log in • Routine Rebels{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-[var(--color-card)] rounded-2xl shadow-sm border border-[var(--color-border)] p-6">
    <h2 class="font-display text-2xl font-semibold text-[var(--color-foreground)] mb-1">Log in</h2>
    <p class="text-sm text-[var(--color-muted-foreground)] mb-6">Access your saved habits and progress.</p>

    {% if errors %}
    <div role="alert" class="mb-5 px-4 py-3 rounded-lg border border-[var(--color-destructive)] text-[var(--color-destructive)] text-sm">
        <ul class="list-disc pl-4 space-y-1">
            {% for error in errors %}<li>{{ error }}</li>{% endfor %}
        </ul>
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
        <div>
            <label for="username" class="block text-sm font-medium text-[var(--color-foreground)] mb-1.5">Username</label>
            <input type="text" id="username" name="username" value="{{ username or '' }}" required
                autocomplete="username"
                class="w-full px-4 py-2.5 border border-[var(--color-border)] rounded-lg bg-[var(--color-background)]">
        </div>
        <div>
            <label for="password" class="block text-sm font-medium text-[var(--color-foreground)] mb-1.5">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password"
                class="w-full px-4 py-2.5 border border-[var(--color-border)] rounded-lg bg-[var(--color-background)]">
        </div>
        <button type="submit"
            class="w-full bg-[var(--color-primary)] text-[var(--color-on-primary)] py-3 rounded-lg font-semibold hover:brightness-105 transition-[filter] duration-200 shadow-sm cursor-pointer">
            Log in
        </button>
    </form>
    <p class="mt-4 text-sm text-[var(--color-muted-foreground)]">
        Don't have an account? <a href="{{ url_for('register') }}" class="text-[var(--color-primary)] font-medium">Create one</a>.
    </p>
</div>
{% endblock %}
